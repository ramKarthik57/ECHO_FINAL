name: ECHO CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install black isort flake8 mypy

    - name: Run Black check
      run: black --check --line-length 120 backend/ utils/ dashboard/ || true

    - name: Run Flake8 check
      run: flake8 backend/ utils/ dashboard/ --max-line-length 120 --ignore=E501,W503,F401,F403 || true

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov httpx

    - name: Create data directory
      run: mkdir -p data

    - name: Generate demo PCAP for tests
      run: python utils/generate_demo_pcap.py || true

    - name: Run unit tests
      run: |
        pytest tests/test_core.py -v
      env:
        PYTHONPATH: .

  api-test:
    name: API Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install httpx pytest

    - name: Create data directory and demo data
      run: |
        mkdir -p data
        python utils/generate_demo_pcap.py || true

    - name: Run API tests
      run: pytest tests/test_api.py -v || true
      env:
        PYTHONPATH: .

