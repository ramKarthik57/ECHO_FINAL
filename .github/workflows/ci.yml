name: ECHO CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install black isort flake8 mypy

    - name: Check formatting with Black
      run: black --check --line-length 100 backend/ utils/ dashboard/

    - name: Check import order with isort
      run: isort --check-only --profile black backend/ utils/ dashboard/

    - name: Lint with flake8
      run: flake8 backend/ utils/ dashboard/ --max-line-length 100 --ignore=E501,W503

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpcap-dev tshark

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx

    - name: Create data directory
      run: mkdir -p data

    - name: Generate demo PCAP for tests
      run: python utils/generate_demo_pcap.py
      continue-on-error: true

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=backend --cov=utils --cov-report=xml --cov-report=term-missing
      env:
        PYTHONPATH: .

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  api-test:
    name: API Integration Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install httpx pytest pytest-asyncio

    - name: Create data directory and demo data
      run: |
        mkdir -p data
        python utils/generate_demo_pcap.py || true

    - name: Run API tests
      run: pytest tests/test_api.py -v
      env:
        PYTHONPATH: .
