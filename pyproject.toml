[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "echo-forensic"
version = "1.0.0"
description = "Encrypted Communication Heuristic Observer — lawful forensic analysis of encrypted network traffic metadata"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "ramKarthik57", url = "https://github.com/ramKarthik57" }
]
keywords = ["forensics", "network-analysis", "packet-capture", "scapy", "fastapi", "cybersecurity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
requires-python = ">=3.8"
dependencies = [
    "setuptools>=65.0.0",
    "scapy>=2.5.0",
    "pyshark>=0.6",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "networkx>=3.1",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "plotly>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "httpx>=0.25",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/ramKarthik57/ECHO_FINAL"
Repository = "https://github.com/ramKarthik57/ECHO_FINAL"
"Bug Tracker" = "https://github.com/ramKarthik57/ECHO_FINAL/issues"

[project.scripts]
echo-analyze = "run_analysis:main"

# ============================================================
# Tool Configurations
# ============================================================

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_first_party = ["backend", "dashboard", "utils"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["data/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["backend", "utils", "dashboard"]
omit = ["*/tests/*", "*/__pycache__/*", "*/data/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
